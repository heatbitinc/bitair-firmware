name: Build and test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            defaults: sdkconfig.defaults
          - name: security
            defaults: sdkconfig.defaults;sdkconfig.defaults.security
    name: firmware (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build merge_bins

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: |
            build/bitair-miner.bin
            build/bitair-miner_full.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: GITHUB_ACTIONS="true" idf.py build
          path: test-ci

      - name: Run tests in QEMU
        uses: bitaxeorg/esp32-qemu-test-action@main
        with:
          path: test-ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: report.xml

      - name: Check for test failures
        if: always()
        run: |
          FAILURES=$(grep -oP 'failures="\K[0-9]+' report.xml || echo 0)
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error ::Detected $FAILURES test failures."
            exit 1
          fi
